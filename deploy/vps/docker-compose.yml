# Podman/Docker Compose stack for UNIT23 one-api on arm64 VPS (opc@kr-arm-2).
# Usage:
#   cp .env.example .env   # fill secrets
#   podman compose -f docker-compose.yml up -d
# or: docker compose -f docker-compose.yml up -d

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oneapi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-oneapi}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oneapi} -d ${POSTGRES_DB:-oneapi}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - oneapi

  redis:
    image: docker.io/library/redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - oneapi

  one-api:
    image: ${ONEAPI_IMAGE:-localhost/unit23/one-api:vps}
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile.vps
      platforms:
        - linux/arm64
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PORT: "3000"
      SQL_DSN: postgres://${POSTGRES_USER:-oneapi}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-oneapi}?sslmode=disable
      REDIS_CONN_STRING: redis://redis:6379/0
      THEME: ${THEME:-open}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/status"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - oneapi

  caddy:
    image: docker.io/library/caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - one-api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - oneapi

networks:
  oneapi:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
